name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Download Chinese font
      run: |
        mkdir -p data
        curl -L -o data/NotoSansSC-Regular.otf \
          "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
        ls -lh data/
        
    - name: Build firmware
      run: pio run -e esp32s3
      
    - name: Build SPIFFS image
      run: |
        pio run -t buildfs -e esp32s3 || true
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NEO-Music-Firmware
        path: |
          .pio/build/esp32s3/firmware.bin
          .pio/build/esp32s3/bootloader.bin
          .pio/build/esp32s3/partitions.bin
          .pio/build/esp32s3/spiffs.bin
        retention-days: 30
