name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Generate Chinese bitmap font
      run: |
        npm install -g lv_font_conv
        mkdir -p data
        # 下载 Noto Sans SC
        curl -L -o /tmp/NotoSansSC-Regular.otf \
          "https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/SC/NotoSansSC-Regular.otf"
        # 生成14px中文位图字体 (仅常用汉字3000个+ASCII+标点)
        lv_font_conv \
          --font /tmp/NotoSansSC-Regular.otf \
          --size 14 \
          --bpp 2 \
          --format lvgl \
          --output data/cn_font_14.bin \
          --symbols "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !@#$%^&*()_+-=[]{}|;':\",./<>?~·。，、；：！？""''（）【】《》…" \
          --range 0x4E00-0x6FFF,0x3000-0x303F,0xFF00-0xFFEF
        # 生成16px中文位图字体
        lv_font_conv \
          --font /tmp/NotoSansSC-Regular.otf \
          --size 16 \
          --bpp 2 \
          --format lvgl \
          --output data/cn_font_16.bin \
          --symbols "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !@#$%^&*()_+-=[]{}|;':\",./<>?~·。，、；：！？""''（）【】《》…" \
          --range 0x4E00-0x6FFF,0x3000-0x303F,0xFF00-0xFFEF
        ls -lh data/
        
    - name: Build firmware
      run: pio run -e esp32s3
      
    - name: Build SPIFFS image
      run: pio run -t buildfs -e esp32s3
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NEO-Music-Firmware
        path: |
          .pio/build/esp32s3/firmware.bin
          .pio/build/esp32s3/bootloader.bin
          .pio/build/esp32s3/partitions.bin
          .pio/build/esp32s3/spiffs.bin
        retention-days: 30
